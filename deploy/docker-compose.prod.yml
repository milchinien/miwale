# miwale.com — Produktion auf dev-cloud.
#
# Das Image kommt aus GHCR und wird von der GitHub-Action auf main gebaut.
# Der Server zieht es selbst (siehe miwale-deploy.sh): dadurch braucht die
# Pipeline keinen eingehenden Zugang zum Server – der haengt hinter Tailscale
# und hat keinen offenen SSH-Port.
#
# Ingress ist das geteilte campsite-nginx aus dem Repo dev-cloud-server-config.
# Der Vertrag nach aussen: Containername `miwale`, Port 8080, Netz campsite-net.
services:
  miwale:
    image: ghcr.io/milchinien/miwale:latest
    container_name: miwale
    restart: unless-stopped
    networks:
      - campsite-net
    # Bewertungen auf den Spielseiten. Das Passwort fuer miwale.com/admin steht
    # in einer .env neben dieser Datei (BEWERTUNGEN_ADMIN_PASSWORT=...), nie im
    # Repository. Ohne Passwort laufen die Bewertungen, nur die Verwaltung ist zu.
    #
    # Ebenso dort: die Zugaenge fuer "Anmelden mit Discord/Google" (siehe
    # README, Abschnitt Konten). Fehlt einer, wird er einfach nicht angeboten.
    # SPIELE_ADRESSE erst setzen, wenn play.miwale.com im DNS und im Ingress
    # steht -- sonst laden die Spiele nicht.
    environment:
      BEWERTUNGEN_ADMIN_PASSWORT: ${BEWERTUNGEN_ADMIN_PASSWORT:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPIELE_ADRESSE: ${SPIELE_ADRESSE:-}
    # Ohne das Volume waeren alle Bewertungen und Konten nach dem naechsten
    # Deployment weg. Es gehoert ins naechtliche Backup (README, Abschnitt Konten).
    volumes:
      - miwale-bewertungen:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  miwale-bewertungen:
    name: miwale-bewertungen

networks:
  campsite-net:
    external: true
    name: xrai-campsite-manager_campsite-net

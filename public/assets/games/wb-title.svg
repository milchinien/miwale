<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10" result="soft"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="soft"></feMergeNode>
        <feMergeNode in="soft"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd8ff" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#7fd8ff" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#7fd8ff" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <g font-family="'Arial Narrow', 'Haettenschweiler', 'Impact', system-ui, sans-serif" text-anchor="middle">
    <text x="800" y="452" font-size="146" font-weight="700" letter-spacing="18" fill="#ffffff" filter="url(#neon)">
      WAVEBREAKER
    </text>
    <text x="800" y="536" font-size="30" letter-spacing="16" fill="#8fa8d4">
      MODULAR COMBAT STATION
    </text>
  </g>

  <rect x="400" y="486" width="800" height="2" fill="url(#rule)"></rect>
</svg>
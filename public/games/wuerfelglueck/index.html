<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Würfelglück</title>
  <style>
    /* Eigene Pixelschrift (fonts/build_font.py), Pixelify Sans (OFL) als Ersatz für fehlende Zeichen. */
    @font-face { font-family: 'Wuerfel Pixel'; src: url('fonts/WuerfelPixel.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Pixelify Sans'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #dev {
      position: fixed; top: 12px; right: 12px; width: 250px; padding: 12px 14px; display: none;
      background: rgba(30, 40, 44, 0.94); border: 2px solid #4F6367; border-radius: 12px;
      font: 15px 'Pixelify Sans', monospace; color: #fff; box-shadow: -3px 5px 0 rgba(0,0,0,.35);
    }
    #dev.open { display: block; }
    #dev h3 { margin: 0 0 8px; font-size: 20px; color: #F3B958; font-weight: normal; }
    #dev small { color: #9FB0B4; }
    #dev label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
    #dev input[type=range] { width: 120px; accent-color: #FE5F55; }
    #dev select { font: inherit; background: #374244; color: #fff; border: 1px solid #5F7377; border-radius: 6px; }
    #dev .row { display: flex; gap: 6px; margin-top: 10px; }
    #dev button { flex: 1; font: inherit; color: #fff; background: #009DFF; border: 0; border-radius: 8px; padding: 6px 0; box-shadow: 0 3px 0 #00609c; cursor: pointer; }
    #dev button:nth-child(2) { background: #FDA200; box-shadow: 0 3px 0 #a86c00; }
    #dev button:nth-child(3) { background: #FE5F55; box-shadow: 0 3px 0 #a83e37; }
    #dev button:active { transform: translateY(3px); box-shadow: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="dev"></div>
  <script src="balatro-fx/balatro-fx.js"></script>
  <script src="balatro-fx/balatro-fx-art.js"></script>
  <script src="rules.js"></script>
  <script src="card-icons.js"></script>
  <script src="ui/palettes.js"></script>
  <script src="ui/glossary.js"></script>
  <script src="ui/layout-classic.js"></script>
  <script src="sound.js"></script>
  <script src="musics/manifest.js"></script>
  <script src="music.js"></script>
  <script src="tutorial.js"></script>
  <script src="saves.js"></script>
  <script src="game.js"></script>
</body>
</html>

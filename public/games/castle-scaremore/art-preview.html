<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle Scaremore · Animationsvorschau</title>
<link rel="stylesheet" href="storybook.css">
<style>
  *{box-sizing:border-box}body{margin:0;background:#111015;color:#ede6d8;font:14px/1.5 system-ui,sans-serif;padding:32px;max-width:1100px;margin:auto}
  h1{font:500 32px Georgia,serif;margin:0}p{color:#a59da9}a{color:#e8b25c}header{margin-bottom:24px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,select{background:#28232f;color:#eee5d8;border:1px solid #514655;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}button.on{background:#dfbe86;color:#221a12}
  .cast{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:radial-gradient(at 50% 40%,#39303d,#1c1922);border:1px solid #53445466;border-radius:16px;text-align:center;padding:12px;min-width:0}
  .card canvas{width:100%;height:180px;display:block}.card b{font-size:13px}.card small{display:block;color:#a79dab}.chests{display:flex;gap:16px;margin-top:30px}.chests .card{width:240px}.chests scaremore-chest{height:196px;width:196px;margin:auto}.chests button{margin-top:10px}#status{font-size:12px}
  @media(max-width:650px){body{padding:20px}.cast{grid-template-columns:repeat(2,1fr)}.chests{flex-wrap:wrap}.chests .card{width:100%}}
</style>
<header><a href="./">← Castle Scaremore</a><h1>Die Besucher von Scaremore</h1><p>16 Figuren · je 32 Geh- und 48 Renn-Frames · zwei Kisten mit je acht Öffnungsstufen.<br>Diese Vorschau verwendet keine Gems und verändert keinen Spielstand.</p></header>
<div class="controls" role="group" aria-label="Animation wählen">
  <button data-state="cycle" class="on">Alle Zustände</button><button data-state="idle">Ruhe</button><button data-state="walk">Gehen</button><button data-state="scared">Erschrecken</button><button data-state="flee">Fliehen</button><button data-state="action">Sonderaktion</button><button id="direction">Richtung wechseln</button><button id="pause">Pause</button><button id="slow">Zeitlupe 0.25x</button><button id="step">Einzelbild +</button>
</div>
<div class="cast" id="cast"></div>
<div class="chests"><section class="card"><b>Crypt Chest</b><scaremore-chest data-kind="crypt" role="img" aria-label="Crypt Chest"></scaremore-chest><button class="replay">Öffnen / Wiederholen</button></section><section class="card"><b>Royal Chest</b><scaremore-chest data-kind="royal" role="img" aria-label="Royal Chest"></scaremore-chest><button class="replay">Öffnen / Wiederholen</button></section></div>
<p id="status" role="status">Assets werden geladen …</p>
<script src="puppet-motion.js"></script>
<script src="puppet-visitors.js"></script>
<script src="storybook.js"></script>
<script>
  const labels=['Touristin','Kind','Fotograf','Joggerin','Skeptiker','Polizistin','Geisterjägerin','König'];
  const specials=['Karte lesen','Eis anschauen','Fotografieren','Verschnaufen','Arme verschränken','Kontrollieren','Geister aufspüren','Empört reagieren'];
  const cards=ScaremoreArt.kinds.flatMap((kind,i)=>[0,1].map(variant=>{
    const el=document.createElement('section');el.className='card';el.innerHTML=`<canvas aria-label="${labels[i]} Animationsvorschau"></canvas><b>${labels[i]} ${variant===0?'A':'B'}</b><small>${specials[i]}</small>`;document.querySelector('#cast').appendChild(el);
    return {kind,artVariant:variant,visitor:{kind,artVariant:variant},canvas:el.querySelector('canvas')};
  }));
  let state='cycle',direction=1,paused=false,slow=false,t=0,last=performance.now();
  document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;t=0;document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('on',x===b));});
  document.querySelector('#direction').onclick=()=>{direction*=-1};
  document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Weiter':'Pause'};
  document.querySelector('#slow').onclick=e=>{slow=!slow;e.target.classList.toggle('on',slow)};
  document.querySelector('#step').onclick=()=>{paused=true;t+=1/48;document.querySelector('#pause').textContent='Weiter'};
  document.querySelectorAll('.replay').forEach(b=>b.onclick=async()=>{b.disabled=true;const sprite=b.parentNode.querySelector('scaremore-chest');sprite.reset();await sprite.play();b.disabled=false;});
  ScaremoreArt.preload().then(()=>{const all=ScaremoreArt.status();document.querySelector('#status').textContent=all.every(a=>a.ready)?`Alle ${all.length} Sprite-Sheets geladen · 16 Figuren / je 128 geriggte Frames / 16 Kisten-Frames.`:'Fehler beim Laden: '+all.filter(a=>!a.ready).map(a=>a.name).join(', ');});
  function loop(now){
    if(!paused)t+=Math.min(.05,(now-last)/1000)*(slow?.25:1);last=now;
    const cycle=t%7.7;
    const current=state==='cycle'?(cycle<1.2?'idle':cycle<3.6?'walk':cycle<4?'scared':cycle<6?'flee':'action'):state;
    for(const {kind,artVariant,visitor,canvas} of cards){
      const w=canvas.clientWidth,h=180,d=Math.min(2,devicePixelRatio||1);
      if(canvas.width!==Math.round(w*d)){canvas.width=Math.round(w*d);canvas.height=h*d;}
      const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
      c.strokeStyle='#8d7b7b25';c.beginPath();c.moveTo(10,167);c.lineTo(w-10,167);c.stroke();
      const st=current==='scared'?(state==='cycle'?cycle-3.6:t%.8):t%1.3;
      c.save();if(direction<0&&current!=='flee'){c.translate(w,0);c.scale(-1,1);}
      Object.assign(visitor,{state:current,st,phase:t*(current==='flee'?19:7),dir:direction,x:w/2});
      ScaremoreArt.drawVisitor(c,visitor,t,{charH:108,walkY:165},0);c.restore();
    }
    requestAnimationFrame(loop);
  }requestAnimationFrame(loop);
</script>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Das Sprenkelmuster der Folie.

    Es ist die Lage, die den Glanz **koernig** macht: Rein aus Verlaeufen sieht eine Folie
    aus wie ein Farbfilm, erst die Streuung darin sieht nach Praegung aus. Die Punkte sitzen
    deshalb unregelmaessig - ein Raster laege als Raster erkennbar auf der Karte.

    Einfarbig weiss und in Deckkraft gestaffelt: Die Farbe entsteht erst durch die
    Mischungen im Stilblatt (`background-blend-mode`), hier steht nur, wo Licht sitzt.
  -->
  <g fill="#ffffff">
    <circle cx="12" cy="18" r="1.6" opacity="0.9"/>
    <circle cx="31" cy="7" r="1.1" opacity="0.55"/>
    <circle cx="47" cy="22" r="2.1" opacity="0.75"/>
    <circle cx="68" cy="11" r="1.3" opacity="0.6"/>
    <circle cx="86" cy="26" r="1.8" opacity="0.85"/>
    <circle cx="21" cy="41" r="1.2" opacity="0.5"/>
    <circle cx="58" cy="45" r="1.7" opacity="0.8"/>
    <circle cx="77" cy="52" r="1.1" opacity="0.45"/>
    <circle cx="8" cy="62" r="1.9" opacity="0.7"/>
    <circle cx="38" cy="68" r="1.3" opacity="0.6"/>
    <circle cx="63" cy="76" r="2" opacity="0.85"/>
    <circle cx="91" cy="71" r="1.2" opacity="0.5"/>
    <circle cx="17" cy="88" r="1.6" opacity="0.75"/>
    <circle cx="45" cy="93" r="1.1" opacity="0.45"/>
    <circle cx="73" cy="95" r="1.5" opacity="0.65"/>
  </g>
  <!-- Ein paar laengliche Kratzer quer dazu. Sie geben der Flaeche eine Richtung, an der
       das wandernde Licht entlanglaeuft. -->
  <g stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.35">
    <path d="M4 30l22-9M34 55l26-11M52 84l24-10M66 33l19-8"/>
  </g>
</svg>

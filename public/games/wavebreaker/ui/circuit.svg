<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 20" fill="none">
  <!--
    Leiterbahnen als Kopfzierde der Faehigkeitenschiene.

    Einfarbig gezeichnet, weil das Bild als Maske benutzt wird (`.pix`-Regel im Stilblatt):
    Die Form kommt von hier, die Farbe aus der Umgebung. Der Verlauf ist bewusst
    unsymmetrisch - eine gespiegelte Zeichnung sieht nach Ornament aus, eine ungleiche nach
    einer Leitung, die irgendwohin fuehrt.
  -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4h9l4 4h12l4-4h9M2 16h13l4-4"/>
    <path d="M38 16h-9l-3-3"/>
  </g>
  <g fill="#ffffff">
    <circle cx="2" cy="4" r="2"/>
    <circle cx="40" cy="4" r="2"/>
    <circle cx="2" cy="16" r="2"/>
    <circle cx="38" cy="16" r="2"/>
  </g>
</svg>

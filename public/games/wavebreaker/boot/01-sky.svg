<!--
  PLATZHALTER - Ebene 1 von 5, Hintergrund des Startbildschirms (src/ui/boot.ts).

  Alle fuenf Ebenen liegen deckungsgleich uebereinander und teilen sich deshalb dieselbe
  Leinwand: 1600 x 900. Wer eine Ebene ersetzt, behaelt dieses Mass bei - sonst verrutscht
  sie gegen die anderen.

  Diese hier ist die einzige deckende: Sie traegt den Grund, alle darueberliegenden sind
  durchsichtig. Farben aus der Palette in src/style.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!--
      Der Grund ist **dunkler gestellt** als zuvor, und zwar deutlich.

      Das Leuchten dieses Spiels entsteht nicht aus hellen Farben, sondern aus dem Abstand
      zwischen fast schwarzem Marineblau und wenigen hellen Kanten (src/style.css, Kopf).
      Ein aufgehellter Grund nimmt jeder Kante genau diesen Abstand - das Bild wird nicht
      heller, sondern flauer, und die Station davor verliert ihr Licht.

      Die Mitte lag bei #152a63 und liegt jetzt bei #0d1c46; die beiden Nebel darueber
      hatten zusammen fast zwei Drittel Deckkraft und haben noch gut ein Drittel. Sie sollen
      dem Grund eine Richtung geben, nicht ihn beleuchten.
    -->
    <radialGradient id="deep" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#0d1c46" />
      <stop offset="42%" stop-color="#060d24" />
      <stop offset="100%" stop-color="#02030a" />
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45cff" stop-opacity="0.19" />
      <stop offset="100%" stop-color="#b45cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#46c8ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#46c8ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#deep)" />

  <!-- Zwei Nebel, gegenlaeufig gesetzt: Der Grund bekommt eine Richtung, ohne dass
       irgendwo eine Kante entsteht. -->
  <ellipse cx="430" cy="250" rx="640" ry="380" fill="url(#violet)" />
  <ellipse cx="1180" cy="620" rx="580" ry="360" fill="url(#cyan)" />

  <g fill="#cfe6ff">
    <circle cx="118" cy="96" r="1.6" opacity="0.7" />
    <circle cx="243" cy="188" r="1.1" opacity="0.45" />
    <circle cx="352" cy="72" r="2" opacity="0.85" />
    <circle cx="474" cy="214" r="1.3" opacity="0.5" />
    <circle cx="588" cy="118" r="1.7" opacity="0.66" />
    <circle cx="655" cy="286" r="1" opacity="0.36" />
    <circle cx="742" cy="64" r="1.4" opacity="0.58" />
    <circle cx="861" cy="196" r="2.2" opacity="0.9" />
    <circle cx="944" cy="98" r="1.2" opacity="0.44" />
    <circle cx="1063" cy="232" r="1.6" opacity="0.62" />
    <circle cx="1147" cy="126" r="1" opacity="0.34" />
    <circle cx="1268" cy="66" r="1.8" opacity="0.74" />
    <circle cx="1341" cy="204" r="1.2" opacity="0.48" />
    <circle cx="1452" cy="132" r="1.5" opacity="0.6" />
    <circle cx="1538" cy="262" r="2.1" opacity="0.82" />
    <circle cx="86" cy="332" r="1.3" opacity="0.5" />
    <circle cx="196" cy="452" r="1.7" opacity="0.64" />
    <circle cx="94" cy="604" r="1.1" opacity="0.4" />
    <circle cx="268" cy="716" r="1.9" opacity="0.72" />
    <circle cx="142" cy="828" r="1.2" opacity="0.46" />
    <circle cx="392" cy="618" r="1" opacity="0.32" />
    <circle cx="512" cy="812" r="1.6" opacity="0.6" />
    <circle cx="1372" cy="418" r="1.4" opacity="0.54" />
    <circle cx="1488" cy="556" r="1.9" opacity="0.7" />
    <circle cx="1284" cy="708" r="1.1" opacity="0.4" />
    <circle cx="1424" cy="818" r="1.5" opacity="0.58" />
    <circle cx="1552" cy="686" r="1" opacity="0.34" />
    <circle cx="1096" cy="836" r="1.7" opacity="0.64" />
    <circle cx="962" cy="742" r="1.1" opacity="0.38" />
    <circle cx="706" cy="866" r="1.3" opacity="0.5" />
  </g>
</svg>

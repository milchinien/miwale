<!--
  PLATZHALTER - Ebene 5 von 5, der Schriftzug (src/ui/boot.ts).

  Die vorderste Ebene und die einzige mit einer Sonderbehandlung: Sie blendet nicht ein,
  sondern **wischt von oben auf** und legt dabei ihre Unschaerfe ab (siehe `hero` in
  src/ui/boot.ts). Deshalb steht hier nur der Schriftzug und sonst nichts - ein Wischer
  ueber ein halbes Bild waere ein Vorhang, kein Auftritt.

  Zwei Hinweise fuer die Ersetzung:

  - Diese Ebene wird als einzige **eingepasst** statt formatfuellend gezeigt (`contain`).
    Auf einem sehr breiten oder sehr schmalen Fenster wird sie damit nie angeschnitten.
  - Der Text ist hier echter Text in einer Systemschrift. Das ist der Platzhalter-Anteil:
    Eine SVG-Datei in einem <img> laedt **keine** Schriftdateien nach, die Pixelschrift des
    Spiels steht hier also nicht zur Verfuegung. Der endgueltige Schriftzug gehoert als
    Kurvenzug (Pfade) oder als PNG mit Alphakanal hierher.

  Leinwand wie alle Ebenen: 1600 x 900.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="soft" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd8ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#7fd8ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7fd8ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g
    font-family="'Arial Narrow', 'Haettenschweiler', 'Impact', system-ui, sans-serif"
    text-anchor="middle"
  >
    <text
      x="800"
      y="452"
      font-size="146"
      font-weight="700"
      letter-spacing="18"
      fill="#ffffff"
      filter="url(#neon)"
    >
      WAVEBREAKER
    </text>
    <text x="800" y="536" font-size="30" letter-spacing="16" fill="#8fa8d4">
      MODULAR COMBAT STATION
    </text>
  </g>

  <rect x="400" y="486" width="800" height="2" fill="url(#rule)" />
</svg>

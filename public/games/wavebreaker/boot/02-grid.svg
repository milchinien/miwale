<!--
  PLATZHALTER - Ebene 2 von 5, Gitterboden (src/ui/boot.ts).

  Ein Fluchtpunktgitter unterhalb der Station. Es hat nur eine Aufgabe: Der Parallaxe eine
  Flaeche zu geben, an der man sie **sieht**. Ein Ebenensatz aus lauter freistehenden
  Objekten laesst die Tiefe raten; eine durchgehende Flaeche zeigt sie.

  Leinwand wie alle Ebenen: 1600 x 900.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Zum Fluchtpunkt hin verschwindet das Gitter, statt dort zu einem Knoten zu
         verkleben. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="18%" stop-color="#000" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#000" stop-opacity="1" />
    </linearGradient>
    <mask id="horizon">
      <rect x="0" y="430" width="1600" height="470" fill="url(#fade)" />
    </mask>
  </defs>

  <g mask="url(#horizon)" stroke="#46c8ff" fill="none" stroke-width="1.6" opacity="0.4">
    <!-- Fluchtlinien aus (800, 430) zur unteren Kante. -->
    <path d="M800 430 L-1240 900" />
    <path d="M800 430 L-720 900" />
    <path d="M800 430 L-280 900" />
    <path d="M800 430 L60 900" />
    <path d="M800 430 L330 900" />
    <path d="M800 430 L560 900" />
    <path d="M800 430 L730 900" />
    <path d="M800 430 L870 900" />
    <path d="M800 430 L1040 900" />
    <path d="M800 430 L1270 900" />
    <path d="M800 430 L1540 900" />
    <path d="M800 430 L1880 900" />
    <path d="M800 430 L2320 900" />
    <path d="M800 430 L2840 900" />

    <!-- Querlinien mit wachsendem Abstand - daraus entsteht die Tiefe. -->
    <path d="M0 452 H1600" opacity="0.5" />
    <path d="M0 482 H1600" opacity="0.6" />
    <path d="M0 524 H1600" opacity="0.7" />
    <path d="M0 582 H1600" opacity="0.8" />
    <path d="M0 660 H1600" opacity="0.9" />
    <path d="M0 762 H1600" />
    <path d="M0 892 H1600" />
  </g>
</svg>

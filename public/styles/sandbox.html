<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style sandbox – miwale Game Style Library</title>
  <meta name="description" content="Playable sandbox of one art style from the miwale Game Style Library.">
  <link rel="stylesheet" href="css/base.css">
  <style>
    /* Sandbox additions on top of the game HUD. */
    #stylebar .style-hint b { font-weight: 700; }
    body.sheet #hud, body.sheet #stylebar { display: none; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    #labels span { position: absolute; transform: translate(-50%, 0); padding: 3px 8px; border-radius: 999px; white-space: nowrap;
      background: rgba(7, 12, 26, .72); color: #e4f8fb; font: 600 11px/1.2 Manrope, system-ui, sans-serif; letter-spacing: .04em;
      border: 1px solid rgba(255, 255, 255, .16); }
    #hint { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .4s; }
    #hint div { padding: 10px 18px; border-radius: 999px; background: rgba(7, 12, 26, .72); color: #e4f8fb;
      font: 700 13px/1.2 Manrope, system-ui, sans-serif; border: 1px solid rgba(255, 255, 255, .2); }
    body.playing #hint, body.sheet #hint { opacity: 0; }
    body.embed #stylebar { bottom: 8px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="xp"><div class="xp-fill"></div><span class="lvl">Lv 1</span></div>
    <div class="topline">
      <div class="hp">
        <canvas class="hp-icon" width="48" height="48"></canvas>
        <div class="hp-bar"><div class="hp-fill"></div></div>
        <span class="hp-text">100/100</span>
      </div>
      <div class="clock"><span class="clock-time">22:00</span><span class="clock-label">sandbox</span></div>
      <div class="kills"><canvas class="kills-icon" width="48" height="48"></canvas><span class="kills-num">0</span></div>
    </div>
  </div>

  <div id="stylebar">
    <span class="style-family"></span>
    <span class="style-name"></span>
    <span class="style-hint"><b>WASD</b> move · <b>Space</b> dash · <b>B</b> autopilot · <b>H</b> HUD</span>
    <span class="auto" hidden></span>
  </div>
  <div id="levelup" class="hidden"><div class="lu-title">Level Up!</div><div class="lu-cards"></div><div class="lu-hint"></div></div>
  <div id="gameover" class="hidden"><div class="go-title"></div><div class="go-stats"></div><div class="go-hint"></div></div>
  <div id="pausebox">Pause</div>
  <div id="labels"></div>
  <div id="hint"><div>Click, then WASD to play</div></div>
  <pre id="errors"></pre>

  <script src="js/core/util.js"></script>
  <script src="js/core/styles.js"></script>
  <script src="js/core/ground.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/core/hud.js"></script>
  <script src="js/sandbox.js"></script>
</body>
</html>

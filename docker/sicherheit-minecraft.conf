# Fuer die Statistik-Seite des Minecraft-Servers (/minecraft/statistics/):
# Skripte, Bilder und die Schrift nur von hier (Texturen und Schrift liefert
# server/minecraft.mjs unter /api/minecraft/). Keine fremden Server: sie bekaemen
# die IP jedes Besuchers.
include /etc/nginx/miwale/sicherheit.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

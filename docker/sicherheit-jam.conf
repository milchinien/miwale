# Fuer die Jam-Seite (/jam/): Skripte nur von hier. Bilder auch von aussen,
# damit in jams.json das Titelbild einer Jam direkt von itch.io kommen kann
# (img.itch.zone).
include /etc/nginx/miwale/sicherheit.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

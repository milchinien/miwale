# Fuer die Verwaltung (/admin/): Hier liegt das Passwort im Tab. Darum die
# strengste Policy -- Skripte nur von hier, nichts einbetten, nirgends hin
# verbinden ausser zu den eigenen Diensten.
include /etc/nginx/miwale/sicherheit.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

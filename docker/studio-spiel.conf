# Hochgeladene Spiele aus dem Studio (server/studio.mjs), nur unter
# play.miwale.com: /community/<slug>/ (veroeffentlicht) und /vorschau/<build>/
# (Testlinks fuer Entwickler und Pruefung). Die Dateien liegen im Datenvolume
# unter /data/studio/web, das Studio legt dort Verweise auf die Builds an.
#
# Eingebunden in die beiden locations des play-Servers (docker/nginx.conf).
# nginx erbt add_header nicht in Unter-locations mit eigenem add_header -- darum
# stehen die Koepfe in jeder location noch einmal.

root /data/studio/web;
try_files $uri $uri/ $uri/index.html =404;
add_header Cache-Control "public, max-age=0, must-revalidate";
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
include /etc/nginx/miwale/spiele-einbetten.conf;

# Vorgepackte Dateien (Unity WebGL mit Brotli oder Gzip): der Browser packt sie
# selbst aus, wenn Content-Encoding stimmt. Der Typ muss zum Inhalt passen --
# mit nosniff liefe ein Skript als application/octet-stream sonst nicht.
# gzip aus, sonst packte nginx die schon gepackte Datei ein zweites Mal.
location ~ \.js\.br$ {
    gzip off; types { } default_type application/javascript;
    add_header Content-Encoding br; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}
location ~ \.wasm\.br$ {
    gzip off; types { } default_type application/wasm;
    add_header Content-Encoding br; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}
location ~ \.(data|json|symbols\.json)\.br$ {
    gzip off; types { } default_type application/octet-stream;
    add_header Content-Encoding br; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}
location ~ \.js\.gz$ {
    gzip off; types { } default_type application/javascript;
    add_header Content-Encoding gzip; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}
location ~ \.wasm\.gz$ {
    gzip off; types { } default_type application/wasm;
    add_header Content-Encoding gzip; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}
location ~ \.(data|json|symbols\.json)\.gz$ {
    gzip off; types { } default_type application/octet-stream;
    add_header Content-Encoding gzip; add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/miwale/spiele-einbetten.conf;
}

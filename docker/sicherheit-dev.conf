# Fuer die Dev-Zentrale (/dev/): wie die Verwaltung, dazu genau eine
# Verbindung nach aussen -- zum Agenten auf dem eigenen Geraet (127.0.0.1:5300).
include /etc/nginx/miwale/sicherheit.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5300; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

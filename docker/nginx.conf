# nginx im Container. Der oeffentliche Ingress (campsite-nginx) terminiert
# TLS und leitet hierher weiter; hier geht es nur um statische Auslieferung.
#
# Zwei Hosts: miwale.com (Seite, Konten, Dienste) und play.miwale.com (nur die
# Spiele). Getrennt, weil ein Spiel sonst mit den Rechten der Seite liefe: Es
# koennte im Namen eines angemeldeten Besuchers Bewertungen schreiben oder sein
# Konto loeschen. Unter eigener Adresse kommt es an Cookies und Dienste von
# miwale.com nicht heran.
#
# Sicherheits-Koepfe: docker/sicherheit.conf und sicherheit-seite.conf. nginx
# erbt add_header nicht in locations mit eigenem add_header -- darum steht das
# include in jeder solchen location noch einmal.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/miwale/sicherheit.conf;

    # Umleitungen ohne Schema und Host ausliefern. Sonst baut nginx sie aus
    # dem, was es selbst sieht -- und das ist hier http auf Port 8080, weil
    # TLS im Ingress davor endet. Der Browser bekaeme "http://miwale.com:8080/"
    # und liefe ins Leere.
    absolute_redirect off;

    # miwale.com/ ist die Spieleseite (index.html), das Portfolio liegt unter
    # /portfolio. Die alten Dateinamen leiten dorthin um. Den Teil hinter dem
    # Doppelkreuz (#projekte/chromatic) behaelt der Browser bei der Umleitung,
    # das Portfolio macht daraus selbst die kurze Form.
    location = "/miwale Portfolio.dc.html" {
        return 301 /portfolio$is_args$args;
    }

    location = "/miwale Portfolio Mobil.dc.html" {
        return 301 /portfolio$is_args$args;
    }

    # Astro baut mit format:'directory' – /projekte/ ist ein Verzeichnis mit
    # index.html. Ohne die 404-Seite waere ein Tippfehler eine leere Seite.
    error_page 404 /404.html;

    # Gehashte Assets aendern bei jeder Aenderung den Namen: lange cachen.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/miwale/sicherheit.conf;
        access_log off;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/miwale/sicherheit.conf;
        access_log off;
    }

    # Einladungslinks fuer Runecall: /games/runecall/raum/A9YW4 ist keine
    # Datei, sondern ein Raumcode. Hier die index.html auszuliefern ginge
    # schief -- das Spiel wird mit relativer Basis gebaut und suchte seine
    # Skripte dann in raum/assets/. Also umleiten auf die Form, die das Spiel
    # selbst liest; der Teil hinter dem Doppelkreuz kommt hier nie an.
    # Der Ausdruck MUSS in Anfuehrungszeichen: geschweifte Klammern sind in
    # der nginx-Konfiguration Blockzeichen. Ohne sie bricht nginx beim Start
    # ab -- und dann antwortet die ganze Seite mit 502, nicht nur dieser Pfad.
    location ~ "^/games/runecall/raum/([A-Za-z0-9]{5})/?$" {
        return 302 "/games/runecall/#$1";
    }

    # Portfolio: alle Reiter liefern dieselbe Datei aus; welcher Reiter,
    # welches Projekt, liest die Seite selbst aus dem Pfad. try_files mit einer
    # vorhandenen Datei liefert sie direkt, ohne die Umleitung oben erneut zu
    # durchlaufen. Die Datei setzt <base href="/">, damit support.js, _ds/ und
    # assets/ auch unter /projekte/chromatic gefunden werden.
    location ~ "^/(portfolio|start|projekte|ueber-mich|ki-workflow|devlog|kontakt)(/[a-z0-9-]+(/spielen)?)?/?$" {
        try_files "/miwale Portfolio.dc.html" =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;
    }

    # Spielseiten der Spieleseite: /games/chromatic und /games/chromatic/spielen.
    # Hier OHNE Schraegstrich am Ende: /games/chromatic/ ist das mitgelieferte
    # Spiel selbst (public/games/chromatic/index.html).
    location ~ "^/games/[a-z0-9-]+(/spielen)?$" {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # Laufen die Spiele unter eigener Adresse (SPIELE_ADRESSE), leitet diese
    # Datei /games/<id>/... dorthin um; sonst ist sie leer. Geschrieben von
    # docker/30-umgebung.sh beim Start. Muss NACH der location oben stehen:
    # /games/chromatic und /games/chromatic/spielen sind Seiten von hier.
    include /etc/nginx/miwale/spiele-umleitung.conf;

    # Weitere Reiter der Spieleseite, dieselbe index.html: Game Requests
    # (/requests ist die Liste der Ideen, /requests/new das Formular), Konto,
    # Datenschutz.
    location ~* "^/(requests(/new)?|account|privacy|datenschutz)/?$" {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # Die Startseite selbst, auch unter ihrem Dateinamen.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # /games, /games/, /Games: die Spieleseite ist jetzt die Startseite.
    location ~* "^/games/?$" {
        return 301 /$is_args$args;
    }

    # Bewertungen auf den Spielseiten: ein kleiner Node-Dienst im selben
    # Container (server/start.mjs, gestartet von docker/40-dienste.sh).
    location /api/bewertungen/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Unveraendert durchreichen: der Ingress haengt die Besucheradresse als
        # letzten Eintrag an. $proxy_add_x_forwarded_for haengte zusaetzlich die
        # Adresse des Ingress an, und dann saehen alle Besucher gleich aus.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Game Requests (server/ideen.mjs), derselbe Dienst. Skizzen und
    # Screenshots kommen einzeln, verkleinert auf hoechstens 900 KB.
    location /api/ideen/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        access_log off;
    }

    # Konten (server/konten.mjs), derselbe Dienst. Die Anmeldung wartet auf
    # Discord oder Google (je hoechstens 10 s), darum etwas mehr Zeit.
    location /api/konto/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
        access_log off;
    }

    # Verwaltung der Bewertungen, Game Requests und Konten. Die Seite selbst ist oeffentlich lesbar, taugt
    # aber ohne das Passwort nichts: jede Anfrage an die Schnittstelle prueft es.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin/index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/miwale/sicherheit-admin.conf;
    }

    # HTML nie hart cachen, sonst sieht niemand ein Deployment.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# play.miwale.com: nur die Spiele. Keine Dienste, keine Verwaltung, keine
# Seite -- dort gibt es nichts, was ein Spiel missbrauchen koennte. Einbetten
# darf sie nur miwale.com (das Spielfenster der Spieleseite).
server {
    listen 8080;
    server_name ~^play\.;

    root /usr/share/nginx/html;
    absolute_redirect off;

    # Wie oben: Raumcodes von Runecall.
    location ~ "^/games/runecall/raum/([A-Za-z0-9]{5})/?$" {
        return 302 "/games/runecall/#$1";
    }

    location /games/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/miwale/spiele-einbetten.conf;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Alles andere (auch /api/ und /admin/) gibt es hier nicht.
    location / {
        return 404;
    }
}

# nginx im Container. Der oeffentliche Ingress (campsite-nginx) terminiert
# TLS und leitet hierher weiter; hier geht es nur um statische Auslieferung.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro baut mit format:'directory' – /projekte/ ist ein Verzeichnis mit
    # index.html. Ohne die 404-Seite waere ein Tippfehler eine leere Seite.
    error_page 404 /404.html;

    # Gehashte Assets aendern bei jeder Aenderung den Namen: lange cachen.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Einladungslinks fuer Runecall: /games/runecall/raum/A9YW4 ist keine
    # Datei, sondern ein Raumcode. Hier die index.html auszuliefern ginge
    # schief -- das Spiel wird mit relativer Basis gebaut und suchte seine
    # Skripte dann in raum/assets/. Also umleiten auf die Form, die das Spiel
    # selbst liest; der Teil hinter dem Doppelkreuz kommt hier nie an.
    # Der Ausdruck MUSS in Anfuehrungszeichen: geschweifte Klammern sind in
    # der nginx-Konfiguration Blockzeichen. Ohne sie bricht nginx beim Start
    # ab -- und dann antwortet die ganze Seite mit 502, nicht nur dieser Pfad.
    location ~ "^/games/runecall/raum/([A-Za-z0-9]{5})/?$" {
        return 302 "/games/runecall/#$1";
    }

    # HTML nie hart cachen, sonst sieht niemand ein Deployment.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# nginx im Container. Der oeffentliche Ingress (campsite-nginx) terminiert
# TLS und leitet hierher weiter; hier geht es nur um statische Auslieferung.
#
# Zwei Hosts: miwale.com (Seite, Konten, Dienste) und play.miwale.com (nur die
# Spiele). Getrennt, weil ein Spiel sonst mit den Rechten der Seite liefe: Es
# koennte im Namen eines angemeldeten Besuchers Bewertungen schreiben oder sein
# Konto loeschen. Unter eigener Adresse kommt es an Cookies und Dienste von
# miwale.com nicht heran.
#
# Sicherheits-Koepfe: docker/sicherheit.conf und sicherheit-seite.conf. nginx
# erbt add_header nicht in locations mit eigenem add_header -- darum steht das
# include in jeder solchen location noch einmal.

# Kompression fuer beide Hosts: Die Datei landet in conf.d und damit im
# http-Block. Frueher stand sie im ersten server-Block, und play.miwale.com
# lieferte die Spiel-Bundles unkomprimiert. Stufe 5 statt 1: kaum mehr CPU,
# merklich kleiner. JS kommt je nach nginx-Version als text/javascript oder
# application/javascript, darum beide; wasm fuer Spiele mit WebAssembly.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/atom+xml text/markdown text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml image/x-icon application/wasm font/ttf font/otf;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/miwale/sicherheit.conf;

    # Umleitungen ohne Schema und Host ausliefern. Sonst baut nginx sie aus
    # dem, was es selbst sieht -- und das ist hier http auf Port 8080, weil
    # TLS im Ingress davor endet. Der Browser bekaeme "http://miwale.com:8080/"
    # und liefe ins Leere.
    absolute_redirect off;

    # miwale.com/ ist die Spieleseite (index.html), das Portfolio liegt unter
    # /portfolio. Die alten Dateinamen leiten dorthin um. Den Teil hinter dem
    # Doppelkreuz (#projekte/chromatic) behaelt der Browser bei der Umleitung,
    # das Portfolio macht daraus selbst die kurze Form.
    location = "/miwale Portfolio.dc.html" {
        return 301 /portfolio$is_args$args;
    }

    location = "/miwale Portfolio Mobil.dc.html" {
        return 301 /portfolio$is_args$args;
    }

    # Schriften und React tragen ihre Version im Dateinamen (manrope-v20-...,
    # react-18.3.1...). Eine neue Version ist eine neue Datei: ewig cachen.
    # Als Praefix, nicht als Ausdruck: ^~ /assets/ unten liesse keinen Ausdruck
    # mehr zum Zug kommen, das laengere Praefix gewinnt aber.
    location ^~ /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/miwale/sicherheit.conf;
        access_log off;
    }

    location ^~ /assets/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/miwale/sicherheit.conf;
        access_log off;
    }

    # Bilder, Trailer, Logos: aendern sich selten, heissen danach aber gleich.
    # Einen Tag ohne Nachfrage, danach noch eine Woche die alte Fassung zeigen
    # und im Hintergrund nachsehen. Vorher fragte der Browser bei jedem Besuch
    # fuer jedes Bild einzeln nach (max-age=0).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        include /etc/nginx/miwale/sicherheit.conf;
        access_log off;
    }

    # Glut laeuft als eigener Dienst. Spiele und Portfolio verlinken ihn nicht.
    location = /usage { return 301 /usage/; }
    location ^~ /usage/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $glut_upstream glut:4318;
        proxy_pass http://$glut_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/miwale/sicherheit.conf;
    }

    # Einladungslinks fuer Runecall: /games/runecall/raum/A9YW4 ist keine
    # Datei, sondern ein Raumcode. Hier die index.html auszuliefern ginge
    # schief -- das Spiel wird mit relativer Basis gebaut und suchte seine
    # Skripte dann in raum/assets/. Also umleiten auf die Form, die das Spiel
    # selbst liest; der Teil hinter dem Doppelkreuz kommt hier nie an.
    # Der Ausdruck MUSS in Anfuehrungszeichen: geschweifte Klammern sind in
    # der nginx-Konfiguration Blockzeichen. Ohne sie bricht nginx beim Start
    # ab -- und dann antwortet die ganze Seite mit 502, nicht nur dieser Pfad.
    location ~ "^/games/runecall/raum/([A-Za-z0-9]{5})/?$" {
        return 302 "/games/runecall/#$1";
    }

    # Portfolio: alle Reiter liefern dieselbe Datei aus; welcher Reiter,
    # welches Projekt, liest die Seite selbst aus dem Pfad. try_files mit einer
    # vorhandenen Datei liefert sie direkt, ohne die Umleitung oben erneut zu
    # durchlaufen. Die Datei setzt <base href="/">, damit support.js, _ds/ und
    # assets/ auch unter /projekte/chromatic gefunden werden.
    location ~ "^/(portfolio|start|projekte|ueber-mich|ki-workflow|devlog|kontakt)(/[a-z0-9-]+(/spielen)?)?/?$" {
        try_files "/miwale Portfolio.dc.html" =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;
    }

    # Spielseiten der Spieleseite: /games/chromatic und /games/chromatic/spielen.
    # Hier OHNE Schraegstrich am Ende: /games/chromatic/ ist das mitgelieferte
    # Spiel selbst (public/games/chromatic/index.html).
    # Je Spiel gibt es eine vorab erzeugte Fassung von index.html (tools/seiten.mjs,
    # beim Bauen des Images) mit eigenem Titel, eigener Vorschau und dem Text im
    # HTML: Discord, X und Crawler fuehren kein JS aus. Ein Spiel ohne eigene
    # Datei bekommt weiter die allgemeine index.html, shop.js zeichnet dann alles.
    location ~ "^/games/([a-z0-9-]+)(/spielen)?$" {
        try_files /seiten/spiel/$1.html /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # Laufen die Spiele unter eigener Adresse (SPIELE_ADRESSE), leitet diese
    # Datei /games/<id>/... dorthin um; sonst ist sie leer. Geschrieben von
    # docker/30-umgebung.sh beim Start. Muss NACH der location oben stehen:
    # /games/chromatic und /games/chromatic/spielen sind Seiten von hier.
    include /etc/nginx/miwale/spiele-umleitung.conf;

    # Weitere Reiter der Spieleseite, dieselbe index.html: Game Requests
    # (/requests ist die Liste der Ideen, /requests/new das Formular), Konto,
    # Datenschutz, Bibliothek, Perlen-Shop, das eigene Profil und fremde
    # Profile (/u/<name>). Bewusst nicht /shop: das ist der Ordner shop/ mit
    # den Skripten.
    location ~* "^/(requests(/new)?|account|privacy|datenschutz|library(/[a-z0-9-]+)?|pearls|profile|u/[a-z0-9_-]{3,20})/?$" {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # Die Startseite selbst, auch unter ihrem Dateinamen.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    location = / {
        try_files /seiten/start.html /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # /games, /games/, /Games: die Spieleseite ist jetzt die Startseite.
    location ~* "^/games/?$" {
        return 301 /$is_args$args;
    }

    # Bewertungen auf den Spielseiten: ein kleiner Node-Dienst im selben
    # Container (server/start.mjs, gestartet von docker/40-dienste.sh).
    location /api/bewertungen/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Unveraendert durchreichen: der Ingress haengt die Besucheradresse als
        # letzten Eintrag an. $proxy_add_x_forwarded_for haengte zusaetzlich die
        # Adresse des Ingress an, und dann saehen alle Besucher gleich aus.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Game Requests (server/ideen.mjs), derselbe Dienst. Skizzen und
    # Screenshots kommen einzeln, verkleinert auf hoechstens 900 KB.
    location /api/ideen/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        access_log off;
    }

    # Profile (server/profil.mjs), derselbe Dienst: Spielzeit-Herzschlaege,
    # Erfolge, Perlen-Shop, oeffentliche Profile unter /api/profil/u/<name>.
    location /api/profil/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 4k;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Stimmen der Game Style Library (server/stimmen.mjs), derselbe Dienst.
    location /api/stimmen/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 8k;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Sterne der Jam-Spiele (server/jam.mjs), derselbe Dienst.
    location /api/jam/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 8k;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Statistiken des Minecraft-Servers (server/minecraft.mjs), derselbe Dienst.
    # Das Panel auf dem PC mit dem Server schickt seinen Stand samt Texturen und
    # Schrift (hoechstens 1 MB).
    location /api/minecraft/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 1m;
        proxy_read_timeout 15s;
        access_log off;
    }

    # Die oeffentliche Statistik-Seite des Minecraft-Servers. Gross/klein und
    # Tippfehler egal (/Minecraft/Statistics, /minecraft/statistik, ...): alles
    # unter /minecraft/stat... fuehrt auf /minecraft/statistics/.
    location ~* "^/minecraft(/stat[a-z]*)?/?$" {
        return 301 /minecraft/statistics/$is_args$args;
    }

    location ^~ /minecraft/statistics/ {
        try_files $uri /minecraft/statistics/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-minecraft.conf;
    }

    # Konten (server/konten.mjs), derselbe Dienst. Die Anmeldung wartet auf
    # Discord oder Google (je hoechstens 10 s), darum etwas mehr Zeit.
    location /api/konto/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
        access_log off;
    }

    # Verwaltung der Bewertungen, Game Requests und Konten. Die Seite selbst ist oeffentlich lesbar, taugt
    # aber ohne das Passwort nichts: jede Anfrage an die Schnittstelle prueft es.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin/index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/miwale/sicherheit-admin.conf;
    }

    # Dev-Zentrale: zeigt die Dev-Server des Geraets, auf dem sie geoeffnet
    # wird. Die Seite kennt keine Geraete -- sie fragt im Browser den Agenten
    # auf 127.0.0.1:5300 (public/dev/agent.mjs); wer keinen hat, sieht die
    # Anleitung. Die CSP erlaubt genau diese eine Verbindung nach localhost.
    location = /dev {
        return 301 /dev/$is_args$args;
    }

    location ^~ /dev/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/miwale/sicherheit-dev.conf;

        # Agent und Installationsskript als Text: das Skript laedt beide mit
        # irm/Invoke-WebRequest, .mjs und .ps1 stehen nicht in mime.types.
        location ~ "^/dev/(agent\.mjs|installieren\.ps1)$" {
            types { text/plain mjs ps1; }
            charset utf-8;
            charset_types text/plain;
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag "noindex, nofollow";
            include /etc/nginx/miwale/sicherheit.conf;
        }
    }

    # Jam-Seite: die Game Jams, bei denen miwale mitgemacht hat, je Jam seine
    # Spiele, und Sterne von Testspielern (server/jam.mjs). /jam/<id> ist
    # dieselbe Seite, jam.js liest die Jam aus dem Pfad.
    location = /jam {
        return 301 /jam/$is_args$args;
    }

    location ^~ /jam/ {
        try_files $uri /jam/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-jam.conf;
    }

    # Game Style Library: 20 Grafik-Styles (aus dem Game-Jam-Spiel "Jack vs.
    # the Turnip Ancestors"), so beschrieben, dass KIs sie uebernehmen koennen.
    # Oeffentlich und fuer Suchmaschinen/KIs gedacht.
    # /Styles (so wird der Link weitergegeben) und /styles ohne Schraegstrich
    # fuehren auf /styles/.
    location = /styles {
        return 301 /styles/$is_args$args;
    }

    location ~ "^/Styles(/.*)?$" {
        return 301 /styles$1$is_args$args;
    }

    location ^~ /styles/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;

        # Vorschaubilder der Styles: wie /assets/ oben.
        location ^~ /styles/shots/ {
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            include /etc/nginx/miwale/sicherheit.conf;
            access_log off;
        }

        # Specs, Tokens und Starter-Code als lesbarer Text, von ueberall
        # abrufbar: KI-Werkzeuge und fremde Seiten sollen sie direkt laden.
        # .md steht nicht in mime.types und kaeme sonst als Download.
        location ~* ^/styles/(llms(-full)?\.txt|styles\.json|library/.+\.(md|json|js))$ {
            types { text/markdown md; text/plain txt; application/json json; text/javascript js; }
            charset utf-8;
            charset_types text/markdown text/plain application/json text/javascript;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header Access-Control-Allow-Origin "*" always;
            include /etc/nginx/miwale/sicherheit.conf;
        }
    }

    # Feed der neuen Spiele und Neuigkeiten (tools/seiten.mjs). Als Atom
    # ausliefern, damit Feed-Reader und Browser ihn als Feed erkennen.
    location = /feed.xml {
        types { application/atom+xml xml; }
        charset utf-8;
        charset_types application/atom+xml;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;
    }

    # Presse-Seite und Presskit (tools/seiten.mjs): mit derselben Content-Security-
    # Policy wie die Spieleseite.
    location ^~ /press/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit-seite.conf;
    }

    # Die vorab erzeugten Seiten gibt es nur unter ihren Adressen (/ und
    # /games/<id>, try_files oben), nicht noch einmal unter /seiten/...
    location ^~ /seiten/ {
        return 404;
    }

    # HTML nie hart cachen, sonst sieht niemand ein Deployment.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/miwale/sicherheit.conf;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

# play.miwale.com: nur die Spiele. Keine Dienste, keine Verwaltung, keine
# Seite -- dort gibt es nichts, was ein Spiel missbrauchen koennte. Einbetten
# darf sie nur miwale.com (das Spielfenster der Spieleseite).
server {
    listen 8080;
    server_name ~^play\.;

    root /usr/share/nginx/html;
    absolute_redirect off;

    # Wie oben: Raumcodes von Runecall.
    location ~ "^/games/runecall/raum/([A-Za-z0-9]{5})/?$" {
        return 302 "/games/runecall/#$1";
    }

    location /games/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/miwale/spiele-einbetten.conf;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Die Spiele der Jam-Seite (public/jam-spiele/<id>/): fertige Builds, die
    # miwale selbst fuer Game Jams gebaut hat. Wie /games/ getrennt von Konten
    # und Diensten, darum auch unter play.miwale.com.
    location /jam-spiele/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/miwale/spiele-einbetten.conf;
    }

    # Alles andere (auch /api/ und /admin/) gibt es hier nicht.
    location / {
        return 404;
    }
}

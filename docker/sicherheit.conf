# Sicherheits-Koepfe fuer alles, was miwale.com ausliefert. Eingebunden im
# server-Block UND in jeder location mit eigenem add_header: nginx erbt
# add_header nicht, sobald eine location selbst eines setzt.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Keine fremde Seite darf miwale.com einbetten (Klick-Fallen).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Nur ueber HTTPS; ueber http (lokal) ignoriert der Browser den Kopf.
add_header Strict-Transport-Security "max-age=31536000" always;

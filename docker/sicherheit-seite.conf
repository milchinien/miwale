# Fuer die HTML-Seite der Spieleseite (index.html): dazu eine Content-Security-
# Policy. Skripte nur von hier, keine eingebetteten -- ein eingeschleustes
# <script> oder onclick= in einem Namen oder Text liefe also nicht, selbst wenn
# das Escapen irgendwo fehlte. Bilder und Videos duerfen von aussen kommen
# (YouTube-Vorschaubilder), Spiele im iframe auch (play.miwale.com, github.io).
include /etc/nginx/miwale/sicherheit.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self'; frame-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

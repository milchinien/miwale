name: Publish

# Nur main wird veröffentlicht. Der Branch ist geschützt, es kommt also
# ausschließlich über einen grünen PR etwas hier an.
on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  image:
    name: Image bauen und nach GHCR pushen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Reicht für GHCR – es braucht KEIN zusätzliches Repository-Secret.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
